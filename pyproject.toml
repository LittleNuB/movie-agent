[project]
name = "movie-agent"
version = "0.1.0"
description = "Local conversational AIGC film creation and revision"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agentscope[service,storage-sql]==2.0.7.post1",
  "aiosqlite>=0.21,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "pydantic>=2.11,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[project.urls]
Repository = "https://github.com/LittleNuB/movie-agent"
Issues = "https://github.com/LittleNuB/movie-agent/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/movie_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110
